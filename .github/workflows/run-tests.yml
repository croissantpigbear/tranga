name: Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'   # the API targets .NET 10 (this was 9.x, so the tests couldn't build)

      - name: Restore dependencies
        run: dotnet restore ./Tranga.sln

      - name: Build the solution
        run: dotnet build ./Tranga.sln --configuration Release --no-restore

      - name: Run unit tests with report
        run: dotnet test ./Tests/Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=TestResults.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: ./Tests/TestResults/TestResults.trx
