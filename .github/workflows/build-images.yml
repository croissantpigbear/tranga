# Builds the Tranga API Docker image for Intel/AMD (amd64) and ARM (arm64, e.g. Raspberry Pi 4/5)
# and publishes it to GitHub Packages: ghcr.io/<your-username>/tranga-api
# Runs on every push to the tranga-plus branch, and on demand (Actions tab → Run workflow).
# Save as .github/workflows/build-images.yml
name: Build images

on:
  push:
    branches: [ "tranga-plus" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Images are only published when the API builds and its tests pass
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build ./Tranga.sln --configuration Release

      - name: Run tests
        run: dotnet test ./Tests/Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (to build for ARM)
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (must be lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tranga-api" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Tranga API (tranga-plus fork)
          cache-from: type=gha
          cache-to: type=gha,mode=max
