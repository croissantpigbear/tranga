# Tranga (fork with FMD2 websites, ComicInfo.xml, Kavita covers, download limits, ...)
#
# Builds the images from source. Clone both repositories next to each other:
#   git clone -b claude https://github.com/croissantpigbear/tranga.git
#   git clone -b claude https://github.com/croissantpigbear/tranga-website.git
#   cd tranga && docker compose up -d --build
# Website: http://localhost:9555   (API: http://localhost:6531/swagger)
#
# On a Raspberry Pi (64-bit OS) this builds ARM64 images automatically; nothing to change.
# To update: git pull in both folders, then docker compose up -d --build

services:
  tranga-api:
    image: tranga-plus-api:latest
    build: .
    container_name: tranga-api
    user: "${UID:-1000}:${GID:-1000}"   # owner of downloaded files (Unraid: 99:100)
    volumes:
      - ./Manga:/Manga                   # downloaded chapters (point Kavita/Komga here)
      - ./settings:/usr/share/tranga-api # settings, uploaded FMD2 modules (lua/), logs
    ports:
      - "6531:6531"
    depends_on:
      tranga-pg:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=tranga-pg
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Europe/London
      # For websites behind Cloudflare; uncomment together with the flaresolverr service below
      #- FLARESOLVERR_URL=http://flaresolverr:8191
      #- POSTGRES_COMMAND_TIMEOUT=30
      #- POSTGRES_CONNECTION_TIMEOUT=30
      #- CHECK_CHAPTERS_BEFORE_START=true
      #- CREATE_COMICINFO_XML=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tranga-website:
    image: tranga-plus-website:latest
    build: ../tranga-website
    container_name: tranga-website
    ports:
      - "9555:80"
    depends_on:
      - tranga-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tranga-pg:
    image: postgres:17
    container_name: tranga-pg
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - TZ=Europe/London
    volumes:
      - ./postgres:/var/lib/postgresql/data   # keeps the database when the container is recreated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional: solves Cloudflare checks for websites that need it
  #flaresolverr:
  #  image: ghcr.io/flaresolverr/flaresolverr:latest
  #  container_name: flaresolverr
  #  environment:
  #    - LOG_LEVEL=info
  #    - TZ=Europe/London
  #  restart: unless-stopped
