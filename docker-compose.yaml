# Tranga (fork with FMD2 websites, ComicInfo.xml, Kavita covers, download limits, ...)
#
# Uses the published images (ghcr.io/croissantpigbear/...): just run  docker compose up -d
# To build from source instead, clone both repositories next to each other:
#   git clone -b tranga-plus https://github.com/croissantpigbear/tranga.git
#   git clone -b tranga-plus https://github.com/croissantpigbear/tranga-website.git
#   cd tranga && docker compose up -d --build
# Website: http://localhost:9555   (API: http://localhost:6531/swagger)
#
# Works on Intel/AMD and ARM64 (Raspberry Pi 4/5 with a 64-bit OS); Docker picks the right one.
# To update: docker compose pull && docker compose up -d   (from source: git pull in both, then up -d --build)

services:
  tranga-api:
    image: ghcr.io/croissantpigbear/tranga-api:latest
    build: .
    container_name: tranga-api
    user: "${UID:-1000}:${GID:-1000}"   # owner of downloaded files (Unraid: 99:100)
    volumes:
      - ./Manga:/Manga                   # downloaded chapters (point Kavita/Komga here)
      - ./settings:/usr/share/tranga-api # settings, uploaded FMD2 modules (lua/), logs
    ports:
      - "6531:6531"
    depends_on:
      tranga-pg:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=tranga-pg
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Europe/London
      # For websites behind Cloudflare; uncomment together with the flaresolverr service below
      #- FLARESOLVERR_URL=http://flaresolverr:8191
      #- POSTGRES_COMMAND_TIMEOUT=30
      #- POSTGRES_CONNECTION_TIMEOUT=30
      #- CHECK_CHAPTERS_BEFORE_START=true
      #- CREATE_COMICINFO_XML=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tranga-website:
    image: ghcr.io/croissantpigbear/tranga-website:latest
    build: ../tranga-website
    container_name: tranga-website
    ports:
      - "9555:80"
    depends_on:
      - tranga-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tranga-pg:
    image: postgres:17
    container_name: tranga-pg
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - TZ=Europe/London
    volumes:
      - ./postgres:/var/lib/postgresql/data   # keeps the database when the container is recreated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional: solves Cloudflare checks for websites that need it
  #flaresolverr:
  #  image: ghcr.io/flaresolverr/flaresolverr:latest
  #  container_name: flaresolverr
  #  environment:
  #    - LOG_LEVEL=info
  #    - TZ=Europe/London
  #  restart: unless-stopped
