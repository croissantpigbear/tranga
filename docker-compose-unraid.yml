# Tranga on Unraid (use with the "Docker Compose Manager" plugin, or `docker compose` over SSH)
# Uses the published images; update with: docker compose pull, then Compose Up (or "Update Stack")
# Every folder is an absolute path: Compose Manager keeps relative paths (./postgres) on the USB flash drive,
# where Postgres cannot start.
# Website: http://<unraid-ip>:9555
#
# Folders (change to suit your shares):
#   /mnt/user/appdata/tranga/settings   Tranga settings, FMD2 modules, logs
#   /mnt/cache/appdata/tranga/postgres  database: keep on the cache/SSD pool, not /mnt/user (if your pool
#                                       isn't called "cache", use its name, e.g. /mnt/nvme/appdata/...)
#   /mnt/user/Manga                     downloaded manga (point Kavita's library at the same folder)
services:
  tranga-api:
    image: ghcr.io/croissantpigbear/tranga-api:latest
    container_name: tranga-api
    user: "99:100"               # Unraid's nobody:users, so shares, SMB and Kavita can read the files
    volumes:
      - /mnt/user/Manga:/Manga
      - /mnt/user/appdata/tranga/settings:/usr/share/tranga-api
    ports:
      - "6531:6531"
    depends_on:
      tranga-pg:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=tranga-pg
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Europe/London
      # Uncomment together with the flaresolverr service below
      #- FLARESOLVERR_URL=http://flaresolverr:8191
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tranga-website:
    image: ghcr.io/croissantpigbear/tranga-website:latest
    container_name: tranga-website
    ports:
      - "9555:80"
    depends_on:
      - tranga-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tranga-pg:
    image: postgres:17
    container_name: tranga-pg
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - TZ=Europe/London
    volumes:
      - /mnt/cache/appdata/tranga/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional: for sites behind Cloudflare
  #flaresolverr:
  #  image: ghcr.io/flaresolverr/flaresolverr:latest
  #  container_name: flaresolverr
  #  environment:
  #    - LOG_LEVEL=info
  #    - TZ=Europe/London
  #  restart: unless-stopped
